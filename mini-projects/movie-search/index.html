<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="heroSection">
        <p id="heroText">
            Find <span id="movieText">Movies</span>
            You'll Enjoy Without The Hassle
        </p>

        <p id="subText">Explore movies worth searching</p>

        <form id="searchForm">
            <input
                type="search"
                id="search"
                placeholder="Search movies..."
            >
            <button type="submit" id="submitButton">🔎︎</button>
        </form>
    </div>

    <h1>Movies</h1>

    <div id="moviesDisplay">

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
